[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "seven-code-mcp"
version = "0.4.0"
description = "7CODE MCP: Windows automation and opt-in durable project memory"
requires-python = ">=3.13"
license = "MIT"
readme = "README.md"
dependencies = ["mcp==1.30.0", "Pillow==12.3.0", "Send2Trash==2.1.0", "pywin32==312; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.urls]
Repository = "https://github.com/7codemcp/7CODE.MCP"

[project.scripts]
seven-code-mcp = "seven_code_mcp.server:main"
seven-code-control = "seven_code_mcp.control:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
